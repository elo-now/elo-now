<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call controls fixture</title></head>
<body><div id="root"></div><script type="module">
import React, { useEffect, useState } from 'react';
import { createRoot } from 'react-dom/client';
import { CallSurface, useCalls } from '/src/calls/CallUI.tsx';
import { ToastProvider } from '/src/Toast.tsx';
import { applyVisualPreferences, readPreferences } from '/src/preferences.ts';
import '/src/style.css';
import '/src/mobile.css';
import '/src/desktop.css';
const h = React.createElement;
const chat = { name: 'Session test', stream: 'conversation', space: 'space', space_context: 'hosting', head: 'configuration', member_names: { remote: 'Remote participant' }, members: [], rows: [] };
const view = { identity: 'local', credential: 'local-device', active_space: 'hosting', name: 'Local participant', contacts: [], streams: [chat], spaces: [{ id: 'hosting', name: 'QA Space' }] };
const participant = (identity) => ({ identity_id: identity, credential_id: identity + '-device', media: { audio_muted: false, video_published: false, screen_published: false } });
const active = { call_id: 'test-call', scope: { hosting_space_id: 'hosting', conversation: { space_id: 'space', stream_id: 'conversation' } }, kind: 'direct', initial_media: 'audio', config_id: 'configuration', key_epoch: 1, started_by: 'local', started_at: 1, phase: 'active', ready: true, participants: { local: participant('local'), remote: participant('remote') } };
function App() {
  const [preferences, setPreferences] = useState(readPreferences);
  const calls = useCalls(null);
  useEffect(() => { applyVisualPreferences(preferences, 'light'); }, [preferences]);
  useEffect(() => {
    let toggles = 0;
    // Keep teardown local: this fixture never sends commands to a hosting service.
    calls.command = async () => ({});
    calls.toggle = async (kind) => {
      toggles++;
      if (kind === 'audio') calls.change({ media: { ...calls.snapshot.media, audio_muted: !calls.snapshot.media.audio_muted } });
    };
    window.callQA = {
      calls,
      toggleCount: () => toggles,
      start: (id = 'test-call') => calls.change({
        phase: 'connected', active: { ...active, call_id: id }, chat,
        media: { audio_muted: false, video_published: true, screen_published: false },
        tiles: ['remote', 'third'].map((credential) => ({ id: credential + '-audio', credential: credential + '-device', source: 'audio', local: false, stream: new MediaStream() })),
      }),
      reconnect: () => calls.change({ phase: 'reconnecting', tiles: [{ id: 'reconnected-audio', credential: 'remote-device', source: 'audio', local: false, stream: new MediaStream() }] }),
      clear: () => calls.change({ active: undefined, phase: 'idle', tiles: [], expanded: false }),
      compact: () => setPreferences((p) => ({ ...p, uiScale: 'compact' })),
    };
    return () => { delete window.callQA; };
  }, [calls]);
  return h(ToastProvider, null, h('main', { className: 'shell', 'data-mobile': String(innerWidth < 768) },
    h(CallSurface, { calls, view, currentChat: chat, onShowCalls: () => {} })));
}
createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
