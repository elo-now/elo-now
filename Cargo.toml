[workspace]
members = ["crates/elo-core", "crates/elo-cli", "crates/elo-wake", "crates/elo-team", "crates/tauri-plugin-elo-push", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
elo-core = { path = "crates/elo-core" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "serialize"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "signal"] }
sha2 = "0.10"
thiserror = "2"
fs2 = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tempfile = "3"

serde = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }
age = { version = "=0.12.1", default-features = false }
getrandom = "0.4"

axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
base64 = "0.22"
subtle = "2"
zeroize = "1"

bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }

rpassword = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# Keep the iOS notification adapter safe for delivered requests after restart.
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
