[workspace]
members = ["crates/elo-core", "crates/elo-cli", "crates/elo-wake", "crates/elo-team", "crates/elo-call-service", "crates/tauri-plugin-elo-push", "crates/tauri-plugin-elo-privacy", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
elo-core = { path = "crates/elo-core" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "serialize"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "signal"] }
sha2 = "0.11"
thiserror = "2"
fs2 = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tempfile = "3"

serde = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }
age = { version = "=0.12.1", default-features = false }
getrandom = "0.4"

axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "original-uri"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
base64 = "0.23"
subtle = "2"
zeroize = "1"
async-trait = "0.1"
bytes = "1"
# Since 0.11, key zeroization must be enabled explicitly (it was unconditional).
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
futures-util = "0.3"
hmac = "0.13"
tokio-util = { version = "0.7", features = ["io"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

bip39 = { version = "3", default-features = false, features = ["std", "zeroize"] }

rpassword = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

# Password-based vaults must not inherit the large unoptimized scrypt overhead
# in local mobile builds. This changes code generation, never KDF parameters.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# Avoid large unoptimized compressor-initialization stack copies in debug mobile
# builds and tests. The codec and compression parameters are unchanged.
[profile.dev.package.miniz_oxide]
opt-level = 3

[patch.crates-io]
# Keep the iOS notification adapter safe for delivered requests after restart.
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
# Xcode 27 internalizes Swift package C exports. Keep the build bridge
# reproducible and promote the shared SwiftRs helpers from Tauri exactly once.
swift-rs = { path = "vendor/swift-rs" }

# Require reenrollment when the enrolled Apple biometrics change.
tauri-plugin-biometry = { path = "vendor/tauri-plugin-biometry" }
# Backport the upstream VariantStrIter fix while Tauri still requires GTK3/glib 0.18.
glib = { path = "vendor/glib" }

# Adopt single-window UIScene lifecycle and fix scene-config ownership on iOS 27.
tao = { path = "vendor/tao" }
# Keep Android share files inside the app's declared, private FileProvider path.
tauri-plugin-sharekit = { path = "vendor/tauri-plugin-sharekit" }
