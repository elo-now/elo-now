name: Desktop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override, e.g. 1.0.6 (requires build_number; empty keeps source version)'
        type: string
      build_number:
        description: 'Build override, e.g. 1137 (requires version; empty keeps source build)'
        type: string
      api_url:
        description: 'Public HTTPS API origin (empty uses repository publisher configuration)'
        type: string
      witness_url:
        description: 'Public HTTPS witness URL ending in /witness/v1'
        type: string
      witness_public_key:
        description: 'Witness signing public key, exactly 64 lowercase hexadecimal characters'
        type: string
      witness_key_generation:
        description: 'Witness signing-key generation, positive integer'
        type: string
      storage_url:
        description: 'Public HTTPS storage broker URL ending in /storage/v1 (no credentials)'
        type: string
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release configuration and startup-smoke helpers
        run: python -m unittest discover -s tools -p 'test_*desktop*.py'
      - name: Validate public configuration and prepare release overrides
        shell: bash
        env:
          # These are public addresses and signing-key pins, never provider credentials.
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_API_URL: ${{ inputs.api_url || vars.ELO_RELEASE_API_URL }}
          RELEASE_SPACE_HOST_URL: ${{ vars.ELO_RELEASE_SPACE_HOST_URL }}
          RELEASE_WAKE_URL: ${{ vars.ELO_RELEASE_WAKE_URL }}
          RELEASE_WITNESS_URL: ${{ inputs.witness_url || vars.ELO_RELEASE_WITNESS_URL }}
          RELEASE_WITNESS_PUBLIC_KEY: ${{ inputs.witness_public_key || vars.ELO_RELEASE_WITNESS_PUBLIC_KEY }}
          RELEASE_WITNESS_KEY_GENERATION: ${{ inputs.witness_key_generation || vars.ELO_RELEASE_WITNESS_KEY_GENERATION }}
          RELEASE_STORAGE_URL: ${{ inputs.storage_url || vars.ELO_RELEASE_STORAGE_URL }}
        run: python tools/prepare_desktop_release.py --output "$RUNNER_TEMP/desktop-release-config.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth xdotool dbus-x11
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci --ignore-scripts
      - name: Check frontend
        run: npm --prefix apps/desktop test
      - name: Verify GLib security backport on Linux
        if: runner.os == 'Linux'
        run: |
          # A patched dependency is not a workspace member. Its isolated tests
          # use the vendored Cargo.lock, including upstream dev dependencies.
          test -s vendor/glib/Cargo.lock || { echo "The vendored GLib test lockfile must be included in the release source." >&2; exit 1; }
          cp -R vendor/glib "$RUNNER_TEMP/elo-glib-test"
          printf '\n[workspace]\n' >> "$RUNNER_TEMP/elo-glib-test/Cargo.toml"
          cargo test --locked --manifest-path "$RUNNER_TEMP/elo-glib-test/Cargo.toml" --lib variant_iter::tests
      - name: Verify Windows downloaded-file protection
        if: runner.os == 'Windows'
        run: cargo test --locked -p elo-desktop --lib download_protection::windows_tests
      - name: Build desktop installer
        if: runner.os != 'macOS'
        shell: bash
        run: >-
          npm --prefix apps/desktop run tauri -- build --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }} --config "$ELO_DESKTOP_CONFIG" --ci -- --locked
      - name: Build macOS installer with an ad hoc bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          npm --prefix apps/desktop run tauri -- build --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }} --config "$ELO_DESKTOP_CONFIG"
          --ci -- --locked
      - name: Install and launch final Linux package with a graphical display
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24'
          dbus-run-session -- python tools/smoke_desktop_installer.py
          target/${{ matrix.target }}/release/bundle --version "$ELO_DESKTOP_VERSION"
          --report dist/desktop-smoke/${{ matrix.name }}/result.json
      - name: Install and launch final Windows package on the interactive desktop
        if: runner.os == 'Windows'
        run: >-
          python tools/smoke_desktop_installer.py
          target/${{ matrix.target }}/release/bundle --version "$env:ELO_DESKTOP_VERSION"
          --report dist/desktop-smoke/${{ matrix.name }}/result.json
      - name: Verify application inside the final macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Tauri removes its staging .app after creating a DMG. Verify the
          # application users actually install, mounted read-only from the DMG.
          installers=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#installers[@]}" -eq 1 && test -f "${installers[0]}"
          mount_point=$(mktemp -d "$RUNNER_TEMP/elo-installer.XXXXXX")
          trap 'hdiutil detach "$mount_point"; rmdir "$mount_point"' EXIT
          hdiutil attach "${installers[0]}" -readonly -nobrowse -mountpoint "$mount_point"
          codesign --verify --deep --strict "$mount_point/elo.now.app"
      - name: Preserve public configuration and startup-smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-checks-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/desktop-release-metadata.json
            dist/desktop-smoke/${{ matrix.name }}/*
          if-no-files-found: warn
      - name: Stage installers and checksums
        run: python tools/stage_desktop_release.py target/${{ matrix.target }}/release/bundle dist/desktop-release/${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elo-now-${{ matrix.name }}
          path: dist/desktop-release/${{ matrix.name }}/*
          if-no-files-found: error
  attest:
    name: Attest final installers
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Build scripts and dependencies never run in the job with signing rights.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: elo-now-*
          path: installers
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'installers/**/*'
