name: Desktop release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Public service endpoints only. Provider credentials never belong in a client.
      TAURI_ELO_SPACE_HOST_URL: ${{ vars.ELO_RELEASE_SPACE_HOST_URL }}
      TAURI_ELO_WAKE_URL: ${{ vars.ELO_RELEASE_WAKE_URL }}
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Require publisher endpoint configuration
        shell: bash
        run: test -n "$TAURI_ELO_SPACE_HOST_URL" && test -n "$TAURI_ELO_WAKE_URL"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci --ignore-scripts
      - name: Check frontend
        run: npm --prefix apps/desktop test
      - name: Verify GLib security backport on Linux
        if: runner.os == 'Linux'
        run: |
          # A patched dependency is not a workspace member, so test its unchanged
          # source in an isolated package. Installer dependencies stay locked.
          cp -R vendor/glib "$RUNNER_TEMP/elo-glib-test"
          printf '\n[workspace]\n' >> "$RUNNER_TEMP/elo-glib-test/Cargo.toml"
          cargo test --manifest-path "$RUNNER_TEMP/elo-glib-test/Cargo.toml" --lib variant_iter::tests
      - name: Verify Windows downloaded-file protection
        if: runner.os == 'Windows'
        run: cargo test --locked -p elo-desktop --lib download_protection::windows_tests
      - name: Build desktop installer
        if: runner.os != 'macOS'
        run: npm --prefix apps/desktop run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
      - name: Build macOS installer with an ad hoc bundle signature
        if: runner.os == 'macOS'
        run: >-
          npm --prefix apps/desktop run tauri -- build --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }} --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          --ci -- --locked
      - name: Verify application inside the final macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Tauri removes its staging .app after creating a DMG. Verify the
          # application users actually install, mounted read-only from the DMG.
          installers=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#installers[@]}" -eq 1 && test -f "${installers[0]}"
          mount_point=$(mktemp -d "$RUNNER_TEMP/elo-installer.XXXXXX")
          trap 'hdiutil detach "$mount_point"; rmdir "$mount_point"' EXIT
          hdiutil attach "${installers[0]}" -readonly -nobrowse -mountpoint "$mount_point"
          codesign --verify --deep --strict "$mount_point/elo.now.app"
      - name: Stage installers and checksums
        run: python tools/stage_desktop_release.py target/${{ matrix.target }}/release/bundle dist/desktop-release/${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elo-now-${{ matrix.name }}
          path: dist/desktop-release/${{ matrix.name }}/*
          if-no-files-found: error
  attest:
    name: Attest final installers
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Build scripts and dependencies never run in the job with signing rights.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: elo-now-*
          path: installers
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'installers/**/*'
