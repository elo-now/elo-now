# Install as /etc/systemd/system/coturn.service.d/elo-hardening.conf.
# Requires the unprivileged TURN ports in SELF_HOSTING (3478/5349).
# Keep certificates/config readable by turnserver before restarting.
[Service]
NoNewPrivileges=true
CapabilityBoundingSet=
ProtectSystem=full
ProtectHome=true
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
