name: elo-api
services:
  api:
    image: elo-api:${ELO_VERSION:?Set the locally built image version}
    pull_policy: never
    user: "21001:21001"
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 2g
    memswap_limit: 2g
    ulimits:
      core: 0
      nofile: 8192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=21001,gid=21001
    volumes:
      - type: bind
        source: ${ELO_STATE:?Initialize the API state directory}/api/config
        target: /etc/elo/api
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ELO_STATE}/api/data
        target: /var/lib/elo-api
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:18900/spaces/v1/health]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: caddy:2.11.7-alpine
    user: "21004:21004"
    network_mode: host
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    ulimits: {core: 0}
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /tmp/caddy-config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=21004,gid=21004
    volumes:
      - type: bind
        source: ${ELO_STATE}/proxy/config
        target: /etc/caddy
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ELO_STATE}/proxy/data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${ELO_STATE}/public
        target: /srv/elo-public
        read_only: true
        bind: {create_host_path: false}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  wake:
    profiles: [wake]
    image: elo-wake:${ELO_VERSION:?Set the locally built image version}
    user: "21006:21006"
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0
      nofile: 8192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=21006,gid=21006
    volumes:
      - type: bind
        source: ${ELO_STATE}/wake/config
        target: /etc/elo/wake
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ELO_STATE}/wake/data
        target: /var/lib/elo-wake
        bind: {create_host_path: false}
    pull_policy: never
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:8788/wake/health]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  calls:
    profiles: [calls]
    image: elo-calls:${ELO_VERSION:?Set the locally built image version}
    user: "21007:21007"
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0
      nofile: 8192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=21007,gid=21007
    volumes:
      - type: bind
        source: ${ELO_STATE}/calls/config
        target: /etc/elo/calls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ELO_STATE}/calls/data
        target: /var/lib/elo-calls
        bind: {create_host_path: false}
    pull_policy: never
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:18920/calls/v1/health]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  media:
    profiles: [calls]
    image: livekit/livekit-server:v1.13.7
    user: "21008:21008"
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 1g
    memswap_limit: 1g
    ulimits:
      core: 0
      nofile: 8192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=21008,gid=21008
    volumes:
      - type: bind
        source: ${ELO_STATE}/media/config
        target: /etc/elo/media
        read_only: true
        bind: {create_host_path: false}
    command: ["--config", "/etc/elo/media/livekit.yaml"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  turn:
    profiles: [calls]
    image: coturn/coturn:4.18.0-r0
    user: "21009:21009"
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0
      nofile: 8192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=21009,gid=21009
      - /var/lib/coturn:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=21009,gid=21009
    volumes:
      - type: bind
        source: ${ELO_STATE}/turn/config
        target: /etc/elo/turn
        read_only: true
        bind: {create_host_path: false}
    command: ["-c", "/etc/elo/turn/turnserver.conf"]
    entrypoint: ["turnserver"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
